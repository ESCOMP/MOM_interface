###############################################################################
# Section 1: (Reusable) List of Fields
#   Field lists to be added to the files defined in Section 3.
###############################################################################
---
FieldLists:
    - &prognostic       ["uo", "vo", "h", "e", "thetao", "so", "KE", "MEKE", "rhopot0", "rhopot2",
                        "difvho", "difvso", "Kv_u", "Kv_v", "taux_bot", "tauy_bot"]

    - &prognostic_z     ["uo", "vo", "h", "thetao", "so", "agessc", "rhopot0", "N2_int", "rhopot2",
                        "difvho", "difvso", "Kv_u", "Kv_v"]

    - &prognostic_rho2  ["thetao", "so", "agessc", "e"]

    - &hist_additional  ["soga", "thetaoga", "uh", "vh", "vhbt", "uhbt", "rsdo"]

    - &tracers          ["agessc", "T_ady_2d", "T_adx_2d", "T_diffy_2d", "T_diffx_2d",
                         "T_hbd_diffx_2d", 'T_hbd_diffy_2d']

    - &surface_flds_common ["tos", "tos:tos_min:min", "tos:tos_max:max",
                         "sos", "sos:sos_min:min", "sos:sos_max:max",
                         "SSU", "SSV", "opottempmint", "somint", "Rd_dx", "speed",
                         "mlotst", "mlotst:mlotst_min:min", "mlotst:mlotst_max:max"]

    - &surface_flds_daily ["zos", "zossq"]

    - &surface_flds_monthly ["tosga", "sosga", "SSH", "mass_wt"]

    - &kpp_diags        ["KPP_OBLdepth:oml", "KPP_OBLdepth:oml_min:min", "KPP_OBLdepth:oml_max:max"]

    - &forcing_flds     ["tauuo", "tauvo", "friver", "prsn", "prlq", "evs", "hfsso", "rlntds",
                         "hfsnthermds", "sfdsi", "rsntds", "hfds", "ustar",
                         "hfsifrazil", "wfo", "ficeberg", "fsitherm",
                         "hflso", "pso", "seaice_melt_heat", "Heat_PmE"]

    - &enthalpy_flds    ["heat_content_lrunoff", "heat_content_frunoff", "heat_content_lprec",
                         "heat_content_fprec", "heat_content_cond",
                         "heat_content_evap"]

    - &forcing_flds_dev ["net_heat_coupler", "LwLatSens", "heat_content_lrunoff",
                         "heat_content_frunoff", "heat_content_lprec",
                         "heat_content_fprec", "heat_content_cond",
                         "hfevapds", "heat_content_surfwater",
                         "vprec_global_adjustment", "net_fresh_water_global_adjustment",
                         "salt_flux_global_restoring_adjustment", "net_massout", "net_massin"]

    - &forcing_flds_b   ["heat_content_frunoff_glc"]

    - &forcing_flds_cg  ["heat_content_vprec", "vprec", "salt_flux_added"]

    - &visc_flds        ["diftrelo", "diftrblo", "difmxybo", "difmxylo"]

    - &static_flds      ["geolon", "geolat", "geolon_c", "geolat_c", "geolon_u", "geolat_u",
                         "geolon_v", "geolat_v", "deptho", "wet", "wet_c", "wet_u",
                         "wet_v", "Coriolis", "areacello", "areacello_cu", "areacello_cv",
                         "areacello_bu", "sin_rot", "cos_rot", "cpocean", "rhozero", "skeb_taper_v",
                         "skeb_taper_u"]

    - &transports       ["volcello", "vmo", "vhGM", "vhml", "umo", "uhGM", "uhml"]

    - &vert_sections_u  ["volcello", "thetao", "so", "umo", "uo"]

    - &vert_sections_v  ["volcello", "thetao", "so", "vmo", "vo"]

    - &cfc_3d  ["cfc11", "cfc12"]

    - &cfc_2d  ["cfc11_flux", "cfc12_flux", "ice_fraction", "u10_sqr"]

    - &geothermal  ["Geo_heat"]

    - &glc_terms ["frunoff_glc", "lrunoff_glc"]

    - &kpp_test ["KPP_QminusSW", "KPP_netSalt", "KPP_NLT_dTdt", "KPP_NLT_dSdt", "KPP_NLT_temp_budget",
                "KPP_NLT_saln_budget"]

    - &cmip7_native ["dispkexyfo", "hfibthermds", "mlotstsq", "pbo", "S_adx_2d", "S_ady_2d", "sob",
                    "sossq", "tob", "tossq", "zos", "zossq", "BS_coeff_h"]

    - &cmip7_z ["opottempdiff", "T_advection_xy", "opottemptend", "osaltdiff",
                "S_advection_xy", "osalttend", "rsdoabsorb"]

    - &cmip7_sfc ["tossq", "rsdo", "T_adx_2d", "T_ady_2d"]

###############################################################################
# Section 2: Defaults for all files, unless overridden in the file entry.
###############################################################################

FileDefaults:
    output_freq: 1
    output_freq_units:
        $TEST == True: "days"
        $OCN_DIAG_MODE == "spinup": "years"
        else: "months"
    time_axis_units: "days"
    reduction_method: "mean"        # time average
    regional_section: "none"        # global
    packing: = 1 if $TEST else 2    # 1: double precision, 2: single precision

###############################################################################
# Section 3: File list
#   The files, i.e., the output streams, to be added to the diag_table. The
#   label of each entry is the name of the stream: it ends up in the file name
#   as ${CASE}.mom6.<label>.<date>.nc, and it is the name that users refer to
#   when adding or removing fields via the diag_table block of user_nl_mom.
#   Labels must therefore follow the h.<name> convention that CESM short term
#   archiving expects (see config_archive.xml). The <date> part of the file name
#   is not specified here: it is derived from how often a new file is started.
###############################################################################

Files:

    # sigma2 coordinate
    h.rho2:
        fields:
            $OCN_DIAG_MODE != "none":
                module:   "ocean_model_rho2"
                lists:    [ *transports,
                            *prognostic_rho2 ]
                lists2:
                    $USE_CFC_CAP == "True":
                        [ *cfc_3d ]

    # native grid
    h.native:
        fields:
            $OCN_DIAG_MODE != "none":
                module:   "ocean_model"
                lists:
                        [ *hist_additional,
                          *tracers,
                          *visc_flds,
                          *transports ]
                lists2:
                    $OCN_DIAG_MODE not in ["spinup", "none"]:
                        [ *prognostic,
                          *kpp_diags,
                          *forcing_flds,
                          *enthalpy_flds,
                          *surface_flds_common,
                          *surface_flds_monthly,
                          *cmip7_native,
                          ["skeb_amp"]]
                    $OCN_DIAG_MODE == "spinup":
                        [ *prognostic,
                          *kpp_diags,
                          *forcing_flds,
                          *enthalpy_flds,
                          *surface_flds_common,
                          *surface_flds_monthly]
                lists3:
                    $USE_CFC_CAP == "True":
                        [ *cfc_2d ]
                lists4:
                    $COMP_ATM == "cam":
                        [ *glc_terms ]
                lists5:
                    $TEST == True:
                        [ *kpp_test ]
                lists6:
                    $COMP_ATM == "cam":
                        [ *forcing_flds_b ]
                    else:
                        [ *forcing_flds_cg ]

    # essential variables mapped to z space
    h.z:
        fields:
            $OCN_DIAG_MODE != "none":
                module:   "ocean_model_z"
                lists:
                    $OCN_DIAG_MODE == "spinup":
                        [ *prognostic_z,
                          *transports ]
                    else:
                        [ *prognostic_z,
                          *transports,
                          *visc_flds,
                          *cmip7_z,
                        ]
                lists2:
                    $USE_CFC_CAP == "True":
                        [ *cfc_3d ]

    # daily averaged surface fields, collected into monthly files
    h.sfc:
        output_freq:
            $OCN_DIAG_MODE == "spinup": 5
            else: 1
        output_freq_units: "days"
        # written daily, but collected into the same files as the history above
        new_file_freq_units:
            $TEST == True: "days"
            $OCN_DIAG_MODE == "spinup": "years"
            else: "months"
        fields:
            $OCN_DIAG_MODE != "none":
                module:   "ocean_model"
                lists:
                    $OCN_DIAG_MODE == "spinup":
                        [ *surface_flds_common,
                          *surface_flds_daily,
                          *kpp_diags ]
                    else:
                        [ *surface_flds_common,
                          *surface_flds_daily,
                          *kpp_diags,
                          *cmip7_sfc ]

    h.frc:
        fields:
            $OCN_DIAG_MODE == "development":
                module:   "ocean_model"
                lists:    [ *forcing_flds,
                            *forcing_flds_dev ]

    h.visc:
        fields:
            $OCN_DIAG_MODE == "development":
                module:   "ocean_model"
                lists:    [ *visc_flds ]

    # written once, at the beginning of the run
    h.static:
        output_freq: -1
        output_freq_units: "days"       # printed, but unused: written once
        reduction_method: ".false."     # instantaneous
        fields:
            module:   "ocean_model"
            lists:    [ *static_flds ]
            lists2:
                $DO_GEOTHERMAL == "True":
                    [ *geothermal ]

    # Sections -----------------------------------------------------------------

    h.Agulhas_Section:
        regional_section:
            $OCN_GRID[:6] == "tx2_3v": "20.1 20.1 -69.8 -34.6 -1 -1"
        fields:
            $OCN_GRID[:6] == "tx2_3v" and $TEST == False and $OCN_DIAG_SECTIONS == True:
